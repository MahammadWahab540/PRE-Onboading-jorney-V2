name: Validate Salesforce-driven No-Cost EMI

on:
  push:
    branches:
      - fix/salesforce-driven-no-cost-emi

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply financing implementation
        run: python scripts/apply_salesforce_financing_patch.py

      - name: Test
        run: npm run test

      - name: Lint / typecheck
        if: always()
        run: npm run lint

      - name: Build
        if: always()
        run: npm run build

      - name: Commit validated implementation
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src functions
          if ! git diff --cached --quiet; then
            git commit -m "fix: use Salesforce-driven no-cost EMI data"
            git push origin HEAD:fix/salesforce-driven-no-cost-emi
          fi
