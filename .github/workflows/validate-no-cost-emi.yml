name: Validate Salesforce-driven No-Cost EMI

on:
  push:
    branches:
      - fix/salesforce-driven-no-cost-emi

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Lint / typecheck
        if: always()
        run: npm run lint

      - name: Build
        if: always()
        run: npm run build
