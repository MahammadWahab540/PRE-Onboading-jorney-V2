name: Validate Cloudflare Pages deployment

on:
  push:
    branches:
      - fix/cloudflare-pages-deployment

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build
      - run: CF_PAGES=1 npm run build
      - run: npx --yes wrangler@latest pages functions build functions --outfile=.tmp/pages-worker.js
