name: Validate Cloudflare Pages deployment

on:
  push:
    branches:
      - fix/cloudflare-pages-deployment

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Typecheck
        if: always()
        run: npm run lint

      - name: Normal build
        if: always()
        run: npm run build

      - name: Cloudflare Pages build
        if: always()
        run: CF_PAGES=1 npm run build

      - name: Compile Pages Functions with Wrangler
        if: always()
        run: npx --yes wrangler@latest pages functions build functions --outfile=.tmp/pages-worker.js
