name: Cloudflare Pages (repo-controlled)

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  verify-and-deploy:
    name: Verify Pages build and deploy if configured
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Typecheck
        run: npm run lint

      - name: Build Pages assets
        run: npm run check:pages

      - name: Compile Pages Functions
        run: npx --yes wrangler@4.130.0 pages functions build functions --outfile=.tmp/pages-worker.js

      - name: Guard Pages Functions bundle size
        run: |
          bytes=$(wc -c < .tmp/pages-worker.js)
          echo "Pages Functions bundle size: ${bytes} bytes"
          test "$bytes" -lt 26214400

      - name: Detect direct-deploy credentials
        id: cloudflare-auth
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare direct deployment is enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare direct deployment skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to GitHub Secrets."
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.cloudflare-auth.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.130.0"
          command: pages deploy dist --project-name=pre-onboarding-journey --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test Pages runtime
        if: steps.cloudflare-auth.outputs.enabled == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "${DEPLOYMENT_URL%/}/api/health"

      - name: Direct deploy not configured
        if: steps.cloudflare-auth.outputs.enabled != 'true'
        run: |
          echo "Build and Functions validation passed."
          echo "No Cloudflare deployment was attempted because the deployment credentials are not configured in GitHub Secrets."
          echo "Required secrets:"
          echo "- CLOUDFLARE_API_TOKEN"
          echo "- CLOUDFLARE_ACCOUNT_ID"
